<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Tarjeta de presentacion digital de Marina - Inoxpan, S.L. (Pando Integral Cooking)">
<title>Marina</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&display=swap">
<style>
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; font:14px system-ui, -apple-system, sans-serif; }
  img{ max-width:100%; }
</style>
<style>
  :root{
    --bg:#ffffff;
    --plate:#ffffff;
    --plate-2:#f2f0ec;
    --ink:#1a1a1a;
    --ink-soft:#6b6b6b;
    --ink-faint:#a3a09a;
    --line:#e4e1da;
    --accent:#8a6a4b;
    --accent-ink:#ffffff;
    --shadow: 0 24px 48px -24px rgba(20,18,14,0.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d0d0d;
      --plate:#161514;
      --plate-2:#211f1c;
      --ink:#f2f0ec;
      --ink-soft:#a3a09a;
      --ink-faint:#6b6862;
      --line:#312e29;
      --accent:#c39b70;
      --accent-ink:#161514;
      --shadow: 0 24px 48px -24px rgba(0,0,0,0.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d0d0d;
    --plate:#161514;
    --plate-2:#211f1c;
    --ink:#f2f0ec;
    --ink-soft:#a3a09a;
    --ink-faint:#6b6862;
    --line:#312e29;
    --accent:#c39b70;
    --accent-ink:#161514;
    --shadow: 0 24px 48px -24px rgba(0,0,0,0.7);
  }

  *{box-sizing:border-box;}
  [hidden]{ display:none !important; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Open Sans', system-ui, sans-serif;
    min-height:100vh;
    display:flex;
    padding:24px 20px;
  }

  .stage{ width:100%; max-width:380px; margin:auto; perspective:1600px; }

  .plate{
    position:relative;
    width:100%;
    min-height:470px;
    transform-style:preserve-3d;
    transition:transform 0.7s cubic-bezier(.2,.8,.2,1);
  }
  .plate.flipped{ transform:rotateY(180deg); }
  @media (prefers-reduced-motion:reduce){ .plate{ transition:none; } }

  .face{
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    background:var(--plate);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .face-front{ position:relative; }
  .face-back{
    position:absolute;
    inset:0;
    transform:rotateY(180deg);
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:12px;
    padding:22px 24px;
  }

  .logo-bar{
    flex-shrink:0;
    background:#ffffff;
    border-bottom:1px solid var(--line);
    padding:16px 26px;
    display:flex;
    align-items:center;
  }
  .logo-bar img{ height:30px; width:auto; display:block; }
  .logo-mini{ height:22px; width:auto; display:block; }
  .logo-chip{
    display:inline-flex;
    background:#ffffff;
    padding:8px 14px;
    border:1px solid var(--line);
  }

  .content{ padding:24px 26px 22px; display:flex; flex-direction:column; flex:1; }

  .brandline{
    font-family:'Open Sans', sans-serif;
    font-size:10.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:0 0 16px;
  }

  .wordmark{ margin:0 0 4px; line-height:1; }
  .wordmark .given{
    display:block;
    font-family:'Montserrat', sans-serif;
    font-weight:700;
    font-size:clamp(28px,7.5vw,33px);
    letter-spacing:-0.01em;
    color:var(--ink);
    text-wrap:balance;
  }
  .wordmark .family{
    display:block;
    font-family:'Montserrat', sans-serif;
    font-weight:400;
    font-size:clamp(28px,7.5vw,33px);
    letter-spacing:-0.01em;
    color:var(--ink-soft);
  }

  .role{
    font-family:'Open Sans', sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin:12px 0 0;
  }

  .org{
    font-family:'Open Sans', sans-serif;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    margin:14px 0 2px;
  }
  .tagline{
    font-family:'Open Sans', sans-serif;
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0;
  }

  .rows{ margin-top:18px; border-top:1px solid var(--line); }
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:11px 0;
    border-bottom:1px solid var(--line);
  }
  .row .label{
    font-family:'Open Sans', sans-serif;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:0.1em;
    color:var(--ink-faint);
    text-transform:uppercase;
    flex-shrink:0;
  }
  .row .value{
    font-family:'Open Sans', sans-serif;
    font-size:14.5px;
    font-weight:500;
    color:var(--ink);
    text-align:right;
    text-decoration:none;
    word-break:break-all;
  }
  .row .value:focus-visible, .btn:focus-visible, .link-btn:focus-visible, .qr-tab:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .copy-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:28px;
    height:28px;
    padding:0;
    background:transparent;
    color:var(--ink-soft);
    border:none;
    border-radius:4px;
    cursor:pointer;
    flex-shrink:0;
    transition:color .15s ease, background .15s ease;
  }
  .copy-btn svg{ width:15px; height:15px; display:block; }
  .copy-btn:hover{ color:var(--ink); background:var(--plate-2); }
  .copy-btn.copied{ color:var(--accent); }

  .actions{
    margin-top:auto;
    padding-top:18px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .btn{
    font-family:'Open Sans', sans-serif;
    font-weight:600;
    font-size:13.5px;
    text-align:center;
    text-decoration:none;
    padding:11px 10px;
    border-radius:2px;
    border:1px solid var(--line);
    color:var(--ink);
    background:none;
  }
  .btn.primary{
    background:#ffffff;
    color:#1a1a1a;
    border-color:#e4e1da;
    font-weight:700;
    grid-column:1 / -1;
  }

  .qr-tabs{ display:flex; gap:8px; }
  .qr-tab{
    font-family:'Open Sans', sans-serif;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    background:none;
    color:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:2px;
    padding:7px 12px;
    cursor:pointer;
  }
  .qr-tab.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

  .qr-wrap{ background:#fdfcfa; padding:14px; border:1px solid var(--line); }
  #qrcode-page, #qrcode-vcard{ display:block; width:210px; height:210px; image-rendering:pixelated; }
  .qr-caption{
    font-family:'Open Sans', sans-serif;
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .link-btn{
    margin-top:4px;
    font-family:'Open Sans', sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    background:none;
    border:none;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
  }
</style>
</head>

<script>
  (function(){
    var plate = document.getElementById('plate');
    var showQr = document.getElementById('show-qr');
    var showFront = document.getElementById('show-front');
    if(showQr) showQr.addEventListener('click', function(){ plate.classList.add('flipped'); });
    if(showFront) showFront.addEventListener('click', function(){ plate.classList.remove('flipped'); });

    var tabPage = document.getElementById('tab-page');
    var tabVcard = document.getElementById('tab-vcard');
    var qrPage = document.getElementById('qrcode-page');
    var qrVcard = document.getElementById('qrcode-vcard');
    var caption = document.getElementById('qr-caption');
    if(tabPage && tabVcard){
      tabPage.addEventListener('click', function(){
        tabPage.classList.add('active'); tabVcard.classList.remove('active');
        qrPage.hidden = false; qrVcard.hidden = true;
        caption.textContent = 'Escanea para abrir esta tarjeta';
      });
      tabVcard.addEventListener('click', function(){
        tabVcard.classList.add('active'); tabPage.classList.remove('active');
        qrPage.hidden = true; qrVcard.hidden = false;
        caption.textContent = 'Escanea para guardar el contacto directamente';
      });
    }

    var copyBtn = document.getElementById('copy-wechat');
    if(copyBtn){
      var copyIcon = copyBtn.innerHTML;
      var checkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>';
      copyBtn.addEventListener('click', function(){
        var text = document.getElementById('wechat-id').textContent;
        var done = function(){
          copyBtn.classList.add('copied');
          copyBtn.innerHTML = checkIcon;
          copyBtn.title = 'Copiado';
          setTimeout(function(){
            copyBtn.classList.remove('copied');
            copyBtn.innerHTML = copyIcon;
            copyBtn.title = 'Copiar';
          }, 1500);
        };
        try{
          if(navigator.clipboard && navigator.clipboard.writeText){
            navigator.clipboard.writeText(text).then(done).catch(done);
          } else {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position='fixed'; ta.style.opacity='0';
            document.body.appendChild(ta);
            ta.select();
            try{ document.execCommand('copy'); }catch(e){}
            document.body.removeChild(ta);
            done();
          }
        }catch(e){ done(); }
      });
    }
  })();
</script>
